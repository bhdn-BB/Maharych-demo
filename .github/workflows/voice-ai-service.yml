name: voice-ai-service

on:
  push:
    branches: [master]
    paths: ["voice_ai_service/**", "proto/**", ".github/workflows/voice-ai-service.yml"]
  pull_request:
    paths: ["voice_ai_service/**", "proto/**", ".github/workflows/voice-ai-service.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice_ai_service
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: voice_ai_service/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test
        run: python -m unittest discover -s tests -v
