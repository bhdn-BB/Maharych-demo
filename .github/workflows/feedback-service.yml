name: feedback-service

on:
  push:
    branches: [master]
    paths: ["feedback_service/**", ".github/workflows/feedback-service.yml"]
  pull_request:
    paths: ["feedback_service/**", ".github/workflows/feedback-service.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: feedback_service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test
        run: python -m unittest test_worker -v
