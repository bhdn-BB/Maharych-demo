# Single public entry point for the Docker Compose setup (http://localhost:8090).
#   /api/v1/, /swagger/  -> Go API (REST + WebSocket audio)
#   /api/auth/, /        -> Next.js (NextAuth, pages, assets)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # 10 MiB covers the 8 MiB audio limit enforced by the API itself.
    client_max_body_size 10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend {
        server backend:8080;
        keepalive 16;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # REST API and interview WebSocket; long idle timeout for voice sessions.
        location /api/v1/ {
            proxy_pass http://backend;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering    off;
        }

        location /swagger/ {
            proxy_pass http://backend;
            proxy_set_header Connection "";
        }

        # NextAuth endpoints and everything else served by Next.js.
        location /api/auth/ {
            proxy_pass http://frontend;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
